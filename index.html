<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6f4f">
<title>Dziennik treningowy</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --card2:#fafbfc; --ink:#14181d; --ink2:#5b6672;
  --line:#e2e6ea; --accent:#2f6f4f; --accent2:#a8643c; --accent-ink:#ffffff;
  --chip:#eef1f4; --hi:#fff6d9; --shadow:0 1px 2px rgba(0,0,0,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --card:#181c21; --card2:#1d2228; --ink:#e8ecf0; --ink2:#98a3af;
    --line:#2a3037; --accent:#4e9b74; --accent2:#c98a5c; --accent-ink:#0d1114;
    --chip:#232930; --hi:#2c2a1c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --card:#181c21; --card2:#1d2228; --ink:#e8ecf0; --ink2:#98a3af;
  --line:#2a3037; --accent:#4e9b74; --accent2:#c98a5c; --accent-ink:#0d1114;
  --chip:#232930; --hi:#2c2a1c; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);border-bottom:1px solid var(--line);padding-top:8px}
.weekbar{display:flex;align-items:center;gap:8px;padding:2px 0 8px}
.weekbar button{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.weekbar .label{flex:1;text-align:center;font-weight:600;font-size:15px}
.weekbar .label small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.days{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.days button{flex:1 0 auto;min-width:40px;padding:8px 4px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days button.has::after{content:"";display:block;width:4px;height:4px;border-radius:50%;
  background:currentColor;margin:3px auto 0;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
.card .top{display:flex;align-items:center;gap:8px;padding:11px 12px}
.badge{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.3px;
  background:var(--chip);color:var(--ink2);padding:3px 7px;border-radius:6px}
.nm{flex:1;font-weight:600;font-size:15px;min-width:0;word-break:break-word}
.kill{flex:0 0 auto;border:0;background:none;color:var(--ink2);font-size:20px;padding:0 2px;cursor:pointer;line-height:1}
.head2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:0 12px 8px;align-items:end}
.fld label{display:block;font-size:11px;color:var(--ink2);margin-bottom:3px;font-weight:600}
.fld input{width:100%;padding:11px 8px;border-radius:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink);font-size:17px;font-weight:600;text-align:center;font-family:inherit}
.fld input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.myo{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);
  font-weight:600;padding-bottom:11px;white-space:nowrap;cursor:pointer}
.myo input{width:19px;height:19px;accent-color:var(--accent);margin:0}
.sets{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.setbox{position:relative;flex:0 0 auto;width:54px}
.setbox span{position:absolute;top:-1px;left:5px;font-size:9px;color:var(--ink2);font-weight:700}
.setbox input{width:100%;padding:13px 4px 7px;border-radius:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink);font-size:16px;font-weight:600;text-align:center;font-family:inherit}
.setbox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.setbox.mio input{border-style:dashed}
.meta{padding:7px 12px;background:var(--card2);border-top:1px solid var(--line);
  font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:700}
.hist{padding:8px 12px 11px;border-top:1px solid var(--line);font-size:12.5px}
.hist .row{display:flex;gap:8px;padding:3px 0;color:var(--ink2)}
.hist .row span:first-child{flex:0 0 46px}
.hist .row b{color:var(--ink);font-weight:600}
.hist .none{color:var(--ink2);font-style:italic}
.add{width:100%;padding:13px;border-radius:12px;border:1px dashed var(--line);
  background:none;color:var(--ink2);font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.empty{text-align:center;color:var(--ink2);padding:32px 16px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--ink2);
  font-size:12px;font-weight:600;cursor:pointer}
nav button.on{color:var(--accent)}
nav button i{display:block;font-size:18px;font-style:normal;margin-bottom:1px}
dialog{border:0;border-radius:14px 14px 0 0;padding:0;width:100%;max-width:720px;
  background:var(--card);color:var(--ink);margin:auto auto 0;max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{position:sticky;top:0;background:var(--card);padding:14px 14px 8px;
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dlg-h b{flex:1;font-size:16px}
.dlg-h button{border:0;background:none;color:var(--ink2);font-size:22px;cursor:pointer}
.dlg-b{padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:70vh}
.search{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink);font-size:16px;margin-bottom:8px;font-family:inherit}
.pick{width:100%;text-align:left;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink);font-size:15px;margin-bottom:6px;cursor:pointer;
  display:flex;gap:8px;align-items:center}
.ghdr{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.4px;margin:12px 0 5px}
.sect{margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:13.5px;width:100%}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child th,tr:last-child td{border-bottom:0}
th{color:var(--ink2);font-weight:600;font-size:11.5px;background:var(--card2)}
th:first-child,td:first-child{
  position:sticky;left:0;z-index:2;text-align:left;font-weight:700;
  border-right:1px solid var(--line);background:var(--card)}
thead th:first-child{background:var(--card2);z-index:3}
thead th{position:sticky;top:0;z-index:1}
select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink);font-size:15px;font-family:inherit;margin-bottom:6px}
.btn{padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.rowf{display:flex;gap:8px;margin:8px 0}
.rowf input,.rowf select{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink);font-size:15px;font-family:inherit;min-width:0;margin:0}
.li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.li .g{flex:1;min-width:0;word-break:break-word}
.banner{background:var(--hi);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:13px;margin:10px 0;color:var(--ink)}
svg{display:block;max-width:100%}
.tip{font-size:12px;color:var(--ink2);margin:6px 0 0}
.extra{display:inline-block;margin-left:7px;font-size:10px;font-weight:700;
  letter-spacing:.3px;color:var(--accent2);border:1px solid var(--accent2);
  border-radius:5px;padding:1px 5px;vertical-align:1px;opacity:.9}
.modes{display:flex;gap:6px;margin-bottom:6px}
.mode{flex:1;padding:10px 6px;border-radius:9px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink2);font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit}
.mode.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.chartcard h4{margin:0 0 6px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="weekbar">
      <button id="wPrev" aria-label="Poprzedni tydzień">&lsaquo;</button>
      <div class="label"><span id="wLbl">&mdash;</span><small id="wSub"></small></div>
      <button id="wNext" aria-label="Następny tydzień">&rsaquo;</button>
    </div>
    <div class="days" id="days"></div>
  </header>
  <main id="main"></main>
</div>

<nav>
  <button data-v="log" class="on"><i>&#9638;</i>Trening</button>
  <button data-v="sum"><i>&#9636;</i>Podsumowanie</button>
  <button data-v="set"><i>&#9881;</i>Ustawienia</button>
</nav>

<dialog id="dlg">
  <div class="dlg-h"><b id="dlgT">Dodaj ćwiczenie</b><button id="dlgX">&times;</button></div>
  <div class="dlg-b" id="dlgB"></div>
</dialog>

<script>
(function(){
"use strict";

var DAYS=["Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota","Niedziela"];
var DSHORT=["Pn","Wt","Śr","Cz","Pt","So","Nd"];
var LS="trening_offline_v3";

var defs={partie:[],cwiczenia:[],plan:{}};
var logs={};
var view="log", curDay=todayIdx(), curWeek=mondayOf(new Date());
var saveTimer=null, lastSaveOk=true;
var selPartia=null, selCw=null;

/* ================= dane startowe ================= */
function seed(){
  return {
    partie:[
      {kod:"PL",nazwa:"Plecy"},{kod:"BB",nazwa:"Bok barku"},{kod:"TB",nazwa:"Tył barku"},
      {kod:"KL",nazwa:"Klatka"},{kod:"PB",nazwa:"Przód barku"},{kod:"BI",nazwa:"Biceps"},
      {kod:"TR",nazwa:"Triceps"},{kod:"4k",nazwa:"Czworogłowy uda"},{kod:"2k",nazwa:"Dwugłowy uda"},
      {kod:"DU",nazwa:"Pośladki"},{kod:"BR",nazwa:"Brzuch"},{kod:"AC",nazwa:"Achilles / łydki"}
    ],
    cwiczenia:[
      {partia:"PL",nazwa:"Wio Lin Masz Szer"},{partia:"PL",nazwa:"Podc Nachw"},
      {partia:"PL",nazwa:"Wio Masz Tal"},{partia:"PL",nazwa:"Ściąg Wyciąg Szer Nachw"},
      {partia:"PL",nazwa:"Wio jednorącz kabel"},{partia:"PL",nazwa:"H Row 30°"},
      {partia:"PL",nazwa:"Podc Neutr"},{partia:"PL",nazwa:"Narciarz"},
      {partia:"BB",nazwa:"Lin Masz 2"},{partia:"BB",nazwa:"H 0 st."},
      {partia:"BB",nazwa:"Lin Masz Old"},{partia:"BB",nazwa:"Lin Masz 1"},
      {partia:"BB",nazwa:"Wznosy hantle"},
      {partia:"TB",nazwa:"Lin Masz TB"},{partia:"TB",nazwa:"Face pull"},
      {partia:"TB",nazwa:"Reverse Bfly"},{partia:"TB",nazwa:"Lin krzyż 2r"},
      {partia:"KL",nazwa:"Lin Masz Góra"},{partia:"KL",nazwa:"Lin Masz Dół"},
      {partia:"KL",nazwa:"Dipy"},{partia:"KL",nazwa:"Smith skos ujemny"},
      {partia:"KL",nazwa:"Butterfly"},
      {partia:"PB",nazwa:"Masz Prost"},{partia:"PB",nazwa:"Wyciskanie hantle"},
      {partia:"BI",nazwa:"H Modl"},{partia:"BI",nazwa:"Masz 2g"},{partia:"BI",nazwa:"Uginanie linka"},
      {partia:"TR",nazwa:"Lin Masz tricep"},{partia:"TR",nazwa:"Masz Tal tricep"},
      {partia:"TR",nazwa:"Pompki francuskie"},
      {partia:"4k",nazwa:"Masz Prost (S4)"},{partia:"4k",nazwa:"Suwnica"},{partia:"4k",nazwa:"Hack"},
      {partia:"2k",nazwa:"Masz 2g leżąc"},{partia:"2k",nazwa:"ROL"},{partia:"2k",nazwa:"SLROL"},
      {partia:"DU",nazwa:"HT Masz"},{partia:"DU",nazwa:"Odwodzenie masz"},
      {partia:"BR",nazwa:"Brzuch — spięcia"},{partia:"BR",nazwa:"Brzuch — nogi"},
      {partia:"AC",nazwa:"Wspięcia stojąc"},{partia:"AC",nazwa:"Wspięcia siedząc"}
    ],
    plan:{
      "0":["Lin Masz Góra","Wio Lin Masz Szer","Dipy","Podc Nachw","Lin Masz 2","H 0 st.","Lin Masz TB","Face pull"],
      "1":["Masz Prost (S4)","ROL","Wspięcia stojąc","Wspięcia siedząc"],
      "2":["Lin Masz Góra","Wio Lin Masz Szer","Dipy","Podc Nachw","Lin Masz 2","H 0 st.","Lin Masz TB","Face pull"],
      "3":[],
      "4":["Masz Prost (S4)","SLROL","HT Masz","Wspięcia stojąc"],
      "5":["Smith skos ujemny","Butterfly","Wio Masz Tal","Ściąg Wyciąg Szer Nachw","Lin Masz Old","Reverse Bfly","Face pull"],
      "6":[]
    }
  };
}

/* ================= daty ================= */
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x;}
function todayIdx(){return (new Date().getDay()+6)%7;}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function addDays(d,n){var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x;}
function fmtShort(d){var m=d.getMonth()+1,dd=d.getDate();
  return (dd<10?"0":"")+dd+"."+(m<10?"0":"")+m;}
function key(ws,day){return iso(ws)+"_"+day;}

/* ================= liczenie ================= */
function num(v){var n=parseFloat(String(v==null?"":v).replace(",",".")); return isNaN(n)?0:n;}
function setsOf(e){return (e&&e.sets)||[];}
function totalReps(e){var t=0,s=setsOf(e); for(var i=0;i<s.length;i++) t+=num(s[i]); return t;}
function filledSets(e){var s=setsOf(e),c=0; for(var i=0;i<s.length;i++) if(num(s[i])>0) c++; return c;}
function volOf(e){return num(e.ciezar)*totalReps(e);}
function topSet(e){var s=setsOf(e),m=0,w=num(e.ciezar);
  for(var i=0;i<s.length;i++){var v=w*num(s[i]); if(v>m)m=v;} return m;}
function topSetReps(e){var s=setsOf(e),m=0;
  for(var i=0;i<s.length;i++) if(num(s[i])>m) m=num(s[i]); return m;}
function hasData(e){return filledSets(e)>0||num(e.ciezar)>0||num(e.serie)>0;}
function partiaOf(nm){
  for(var i=0;i<defs.cwiczenia.length;i++) if(defs.cwiczenia[i].nazwa===nm) return defs.cwiczenia[i].partia;
  return "";
}

/* ================= zapis ================= */
function save(){
  try{ localStorage.setItem(LS,JSON.stringify({v:2,defs:defs,logs:logs})); lastSaveOk=true; }
  catch(e){ lastSaveOk=false; }
}
function migrate(e){
  if(e.sets) return e;
  var arr=[];
  if(e.reps){
    var p=String(e.reps).replace(/[^0-9+.,\s]/g,"").split(/[+,\s]+/);
    for(var i=0;i<p.length;i++){var n=parseFloat(p[i]); if(!isNaN(n)) arr.push(String(n));}
  }
  e.sets=arr; if(!e.serie&&arr.length) e.serie=String(arr.length);
  delete e.reps; if(typeof e.myo!=="boolean") e.myo=false;
  return e;
}
function load(){
  var raw=null;
  try{ raw=localStorage.getItem(LS)||localStorage.getItem("trening_offline_v1"); }catch(e){}
  if(raw){
    try{
      var o=JSON.parse(raw);
      defs=o.defs||seed(); logs=o.logs||{};
      Object.keys(logs).forEach(function(k){ (logs[k].entries||[]).forEach(migrate); });
      save(); return;
    }catch(e){}
  }
  defs=seed(); logs={}; save();
}
function queueSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(save,500); }

/* ================= model ================= */
function dayEntry(ws,day,create){
  var k=key(ws,day);
  if(!logs[k]&&create) logs[k]={weekStart:iso(ws),day:day,entries:[]};
  return logs[k];
}
function planFor(day){return (defs.plan&&defs.plan[String(day)])||[];}
function setPlan(day,arr){defs.plan[String(day)]=arr;}
function blank(nm){return {cw:nm,serie:"",ciezar:"",sets:[],myo:false};}

function entriesFor(ws,day){
  var e=dayEntry(ws,day,false);
  var plan=planFor(day), skip=(e&&e.skip)||[];
  var list=[], have={};
  if(e) e.entries.forEach(function(x){
    have[x.cw]=1;
    list.push({nm:x.cw, adhoc:plan.indexOf(x.cw)<0});
  });
  plan.forEach(function(nm){
    if(!have[nm]&&skip.indexOf(nm)<0) list.push({nm:nm, adhoc:false});
  });
  return list;
}
function liveEntry(ws,day,nm){
  var e=dayEntry(ws,day,true);
  for(var i=0;i<e.entries.length;i++) if(e.entries[i].cw===nm) return e.entries[i];
  var n=blank(nm); e.entries.push(n); return n;
}
function removeEntry(ws,day,nm,fromPlan){
  var e=dayEntry(ws,day,true);
  e.entries=e.entries.filter(function(x){return x.cw!==nm});
  if(fromPlan){
    setPlan(day,planFor(day).filter(function(x){return x!==nm}));
    if(e.skip) e.skip=e.skip.filter(function(x){return x!==nm});
  } else if(planFor(day).indexOf(nm)>=0){
    e.skip=(e.skip||[]); if(e.skip.indexOf(nm)<0) e.skip.push(nm);
  }
  save();
}
function addExercise(day,nm,permanent){
  if(permanent){
    var p=planFor(day);
    if(p.indexOf(nm)<0) setPlan(day,p.concat([nm]));
  }
  var e=dayEntry(curWeek,day,true);
  if(e.skip) e.skip=e.skip.filter(function(x){return x!==nm});
  liveEntry(curWeek,day,nm);
  save();
}
function dateOfLog(L){ return addDays(parseISO(L.weekStart),L.day); }
function parseISO(s){ var p=String(s).split("-");
  return new Date(+p[0],(+p[1])-1,+p[2]); }
/* ostatnie wykonania tego ćwiczenia, z DOWOLNEGO dnia, wcześniejsze niż podana data */
function history(nm,beforeDate,n){
  var out=[], bi=iso(beforeDate);
  Object.keys(logs).forEach(function(k){
    var L=logs[k]; if(!L||!L.entries) return;
    var dt=dateOfLog(L); if(iso(dt)>=bi) return;
    for(var j=0;j<L.entries.length;j++){
      var x=L.entries[j];
      if(x.cw===nm&&hasData(x)){ out.push({d:dt,e:x}); break; }
    }
  });
  out.sort(function(a,b){return b.d-a.d});
  return out.slice(0,n);
}

/* ================= render ================= */
function el(t,c,txt){var e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;}

function renderHeader(){
  document.getElementById("wLbl").textContent="Tydzień "+fmtShort(curWeek)+" – "+fmtShort(addDays(curWeek,6));
  var thisW=mondayOf(new Date()), diff=Math.round((curWeek-thisW)/604800000);
  document.getElementById("wSub").textContent=
    diff===0?"bieżący":(diff<0?Math.abs(diff)+" tyg. temu":"za "+diff+" tyg.");
  var d=document.getElementById("days"); d.innerHTML="";
  for(var i=0;i<7;i++){(function(i){
    var e=logs[key(curWeek,i)];
    var has=e&&e.entries.some(hasData);
    var b=el("button",(i===curDay?"on ":"")+(has?"has":""),DSHORT[i]);
    b.onclick=function(){curDay=i; render();};
    d.appendChild(b);
  })(i);}
}

function renderLog(){

function card(nm,adhoc){
  var en=liveEntry(curWeek,curDay,nm);
  var c=el("div","card"), top=el("div","top");
  top.appendChild(el("span","badge",partiaOf(nm)||"—"));
  var t=el("div","nm",nm);
  if(adhoc){ var e2=el("span","extra","dodatkowe"); t.appendChild(e2); }
  top.appendChild(t);
  var k=el("button","kill","×");
  k.onclick=function(){ askRemove(nm,adhoc); };
  top.appendChild(k); c.appendChild(top);

  var h2=el("div","head2");
  var fS=fld("Serie",en.serie,"num",function(v){
    en.serie=v; resize(); queueSave(); drawSets(); upd();
  });
  var fW=fld("Ciężar kg",en.ciezar,"txt",function(v){ en.ciezar=v; queueSave(); upd(); });
  var lab=el("label","myo");
  var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!en.myo;
  cb.onchange=function(){ en.myo=cb.checked; queueSave(); drawSets(); upd(); };
  lab.appendChild(cb); lab.appendChild(document.createTextNode("myo"));
  h2.appendChild(fS); h2.appendChild(fW); h2.appendChild(lab);
  c.appendChild(h2);

  var setsWrap=el("div","sets"); c.appendChild(setsWrap);

  function resize(){
    var n=Math.max(0,Math.min(20,Math.round(num(en.serie))));
    var s=en.sets||[];
    while(s.length<n) s.push("");
    if(s.length>n) s.length=n;
    en.sets=s;
  }
  function drawSets(){
    resize();
    setsWrap.innerHTML="";
    if(!en.sets.length){ setsWrap.appendChild(el("div","tip","Wpisz liczbę serii, pojawią się okienka na powtórzenia.")); return; }
    en.sets.forEach(function(v,i){
      var b=el("div","setbox"+(en.myo&&i>0?" mio":""));
      b.appendChild(el("span",null,String(i+1)));
      var inp=document.createElement("input");
      inp.type="text"; inp.inputMode="numeric"; inp.value=v||"";
      inp.autocomplete="off";
      inp.oninput=function(){ en.sets[i]=inp.value; queueSave(); upd(); };
      inp.onkeydown=function(ev){
        if(ev.key==="Enter"){
          var all=setsWrap.querySelectorAll("input");
          if(all[i+1]) all[i+1].focus();
          else inp.blur();
          ev.preventDefault();
        }
      };
      b.appendChild(inp); setsWrap.appendChild(b);
    });
  }

  var meta=el("div","meta"), mA=el("span"), mB=el("span");
  meta.appendChild(mA); meta.appendChild(mB); c.appendChild(meta);
  function upd(){
    var t=totalReps(en), v=volOf(en), n=filledSets(en), ts=topSet(en);
    var avg = (en.myo||!n) ? null : Math.round(t/n*10)/10;
    mA.innerHTML="Powt.: <b>"+t+"</b>"+(avg!=null?" · śr/serię: <b>"+avg+"</b>":(en.myo?" · <b>myo</b>":""));
    mB.innerHTML="Objętość: <b>"+Math.round(v)+"</b> kg · top: <b>"+Math.round(ts)+"</b>";
  }
  drawSets(); upd();

  var hs=history(nm,addDays(curWeek,curDay),3), hh=el("div","hist");
  if(!hs.length) hh.appendChild(el("div","none","Brak wcześniejszych wykonań"));
  else hs.forEach(function(x){
    var r=el("div","row");
    var dIdx=(x.d.getDay()+6)%7;
    r.appendChild(el("span",null,DSHORT[dIdx]+" "+fmtShort(x.d)));
    var s=document.createElement("span");
    var reps=setsOf(x.e).filter(function(q){return num(q)>0}).join(" · ");
    s.innerHTML="<b>"+(num(x.e.ciezar)||"–")+" kg</b> · "+(reps||"–")+(x.e.myo?" · myo":"");
    r.appendChild(s); hh.appendChild(r);
  });
  c.appendChild(hh);
  return c;
}

/* ================= wykresy ================= */
function chart(opts){
  var d=opts.data, labels=opts.labels, kind=opts.kind||"bar";
  var W=340,H=100,pad=6,n=Math.max(d.length,1);
  var max=Math.max.apply(null,d.concat([0]));
  var min=0;
  if(kind==="line"){
    var pos=d.filter(function(x){return x>0});
    min=pos.length?Math.min.apply(null,pos):0;
    if(max===min) {max=max+1; min=Math.max(0,min-1);}
    min=Math.max(0,min-(max-min)*0.15);
  }
  if(max<=0) max=1;
  var s='<svg viewBox="0 0 '+W+' '+(H+20)+'" role="img" aria-label="'+(opts.title||"")+'">';
  var bw=(W-pad*2)/n;
  function y(v){ return kind==="line" ? H-((v-min)/(max-min))*H : H-(v/max)*H; }
  if(kind==="bar"){
    d.forEach(function(v,i){
      var hgt=Math.max((v/max)*H,v>0?2:1);
      s+='<rect x="'+(pad+i*bw+2).toFixed(1)+'" y="'+(H-hgt).toFixed(1)+'" width="'+Math.max(bw-4,2).toFixed(1)+
         '" height="'+hgt.toFixed(1)+'" rx="3" fill="'+(opts.color||"var(--accent)")+'" opacity="'+(v>0?0.85:0.18)+'"/>';
    });
  } else {
    var pts=[];
    d.forEach(function(v,i){ if(v>0) pts.push([pad+i*bw+bw/2, y(v)]); });
    if(pts.length>1){
      s+='<polyline fill="none" stroke="'+(opts.color||"var(--accent)")+'" stroke-width="2.5" stroke-linejoin="round" points="'+
         pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ")+'"/>';
    }
    pts.forEach(function(p){
      s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="'+(opts.color||"var(--accent)")+'"/>';
    });
  }
  labels.forEach(function(L,i){
    if(n>10&&i%2) return;
    s+='<text x="'+(pad+i*bw+bw/2).toFixed(1)+'" y="'+(H+14)+'" font-size="8.5" text-anchor="middle" fill="var(--ink2)">'+L+'</text>';
  });
  s+='</svg>';
  var c=el("div","chartcard");
  if(opts.title){var t=document.createElement("h4"); t.textContent=opts.title; c.appendChild(t);}
  var box=document.createElement("div"); box.innerHTML=s; c.appendChild(box);
  if(opts.note) c.appendChild(el("p","tip",opts.note));
  return c;
}

/* ================= podsumowanie ================= */
function weeksBack(n){var a=[]; for(var i=n-1;i>=0;i--) a.push(addDays(curWeek,-7*i)); return a;}

function seriesPerPartia(ws){
  var out={};
  for(var d=0;d<7;d++){
    var e=logs[key(ws,d)]; if(!e) continue;
    e.entries.forEach(function(x){
      var p=partiaOf(x.cw)||"—", s=filledSets(x)||Math.round(num(x.serie));
      if(s) out[p]=(out[p]||0)+s;
    });
  }
  return out;
}
function exWeek(ws,nm){
  var s=0,v=0,mx=0,r=0,ts=0;
  for(var d=0;d<7;d++){
    var e=logs[key(ws,d)]; if(!e) continue;
    e.entries.forEach(function(x){
      if(x.cw!==nm) return;
      s+=filledSets(x); r+=totalReps(x); v+=volOf(x);
      if(num(x.ciezar)>mx) mx=num(x.ciezar);
      if(topSet(x)>ts) ts=topSet(x);
    });
  }
  return {s:s,v:v,mx:mx,r:r,ts:ts};
}
function exSessions(nm,weeks){
  var out=[];
  weeks.forEach(function(ws){
    for(var d=0;d<7;d++){
      var e=logs[key(ws,d)]; if(!e) continue;
      e.entries.forEach(function(x){
        if(x.cw!==nm||!hasData(x)) return;
        out.push({date:addDays(ws,d),w:num(x.ciezar),top:topSet(x),reps:topSetReps(x)});
      });
    }
  });
  out.sort(function(a,b){return a.date-b.date});
  return out;
}

/* ================= eksport / import ================= */
function dl(name,text,mime){
  function blobFallback(){
    try{
      var blob=new Blob(["\ufeff"+text],{type:mime+";charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){document.body.removeChild(a); URL.revokeObjectURL(url);},400);
    }catch(e){
      var w=window.open("","_blank");
      if(w) w.document.write("<pre>"+text.replace(/[<&]/g,function(m){return m==="<"?"&lt;":"&amp;"})+"</pre>");
      else alert("Nie udało się pobrać pliku.");
    }
  }
  if(typeof claude!=="undefined"&&claude&&typeof claude.use==="function"){
    claude.use("downloads").then(function(d){
      if(d&&d.save) return d.save({filename:name,data:text});
      blobFallback();
    }).catch(blobFallback);
  } else blobFallback();
}
function stamp(){return iso(new Date());}
function expJSON(){ dl("trening-kopia-"+stamp()+".json",JSON.stringify({v:2,defs:defs,logs:logs}),"application/json"); }
function expCSV(){
  var rows=[["data_tygodnia","dzien","partia","cwiczenie","serie","ciezar","powtorzenia","suma_powt","objetosc","top_seria","myo"]];
  Object.keys(logs).sort().forEach(function(k){
    var e=logs[k];
    e.entries.forEach(function(x){
      if(!hasData(x)) return;
      rows.push([e.weekStart,DAYS[e.day],partiaOf(x.cw),x.cw,filledSets(x),x.ciezar,
        setsOf(x).join("+"),totalReps(x),Math.round(volOf(x)),Math.round(topSet(x)),x.myo?"tak":""]);
    });
  });
  var csv=rows.map(function(r){return r.map(function(c){
    var s=String(c==null?"":c); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";");}).join("\n");
  dl("trening-"+stamp()+".csv",csv,"text/csv");
}
function impJSON(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(String(fr.result));
      if(!o||!o.defs) throw new Error("zły format");
      if(!confirm("Wczytać kopię? Obecne dane zostaną zastąpione.")) return;
      defs=o.defs; logs=o.logs||{};
      Object.keys(logs).forEach(function(k){ (logs[k].entries||[]).forEach(migrate); });
      save(); render(); alert("Wczytano.");
    }catch(e){ alert("Nie udało się odczytać pliku: "+e.message); }
  };
  fr.readAsText(file);
}

  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
}
function askRemove(nm,adhoc){
  if(adhoc){
    if(confirm("Usunąć „"+nm+"” z tego dnia? (nie było w stałym planie)")){
      removeEntry(curWeek,curDay,nm,false); render();
    }
    return;
  }
  var dlg=document.getElementById("dlg"), b=document.getElementById("dlgB");
  document.getElementById("dlgT").textContent="Usuń: "+nm;
  b.innerHTML="";
  b.appendChild(el("p","tip","To ćwiczenie jest w stałym planie na "+DAYS[curDay].toLowerCase()+"."));
  var b1=el("button","pick","Pomiń tylko w tym tygodniu");
  b1.onclick=function(){ removeEntry(curWeek,curDay,nm,false); closeDlg(); render(); };
  var b2=el("button","pick","Usuń z planu na stałe");
  b2.onclick=function(){ if(confirm("Usunąć „"+nm+"” z planu na "+DAYS[curDay].toLowerCase()+"?")){
    removeEntry(curWeek,curDay,nm,true); closeDlg(); render(); } };
  var b3=el("button","pick","Anuluj");
  b3.onclick=closeDlg;
  b.appendChild(b1); b.appendChild(b2); b.appendChild(b3);
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
}
function closeDlg(){var d=document.getElementById("dlg"); if(d.close) d.close(); else d.removeAttribute("open");}
document.getElementById("dlgX").onclick=closeDlg;

/* ================= routing ================= */
function render(){
  renderHeader();
  if(view==="log") renderLog();
  else if(view==="sum") renderSum();
  else renderSet();
  document.querySelector("header").style.display=(view==="log")?"":"none";
}
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
  b.onclick=function(){
    view=b.getAttribute("data-v");
    Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(x){
      x.className=(x===b)?"on":"";
    });
    render();
  };
});
document.getElementById("wPrev").onclick=function(){curWeek=addDays(curWeek,-7); render();};
document.getElementById("wNext").onclick=function(){curWeek=addDays(curWeek,7); render();};
window.addEventListener("beforeunload",function(){ if(saveTimer) clearTimeout(saveTimer); save(); });
document.addEventListener("visibilitychange",function(){ if(document.hidden) save(); });

load();
render();
})();
</script>
</body>
</html>
